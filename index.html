<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Global Connector Fixed</title>
<style>body{font-family:Arial;background:#eef2f7;padding:10px}h1{text-align:center}.container{display:flex;gap:15px;justify-content:center;flex-wrap:wrap}.box{background:#fff;width:360px;border-radius:12px;padding:15px;box-shadow:0 2px 10px rgba(0,0,0,.1)}select{width:100%;padding:8px;margin-bottom:10px;border-radius:6px}.chat{height:350px;overflow-y:auto;border:1px solid #ddd;padding:10px;border-radius:8px;background:#fafafa;margin-bottom:10px}.msg{padding:8px 12px;border-radius:15px;margin:5px 0;max-width:80%}.me{background:#0084ff;color:#fff;margin-left:auto}.other{background:#e4e6eb}.input-area{display:flex;gap:5px}input{flex:1;padding:10px 15px;border-radius:20px;border:1px solid #ccc}button{padding:10px 15px;border:none;background:#0084ff;color:#fff;border-radius:20px;cursor:pointer}</style></head>
<body><h1>🌐 Global Connector</h1><div class="container">
<div class="box"><h3>User A</h3><select id="langA"><option value="en" selected>English</option><option value="es">Spanish</option><option value="fr">French</option><option value="ur">Urdu</option></select><div class="chat" id="chatA"></div><div class="input-area"><input id="inputA" placeholder="Type..."><button onclick="sendA()">Send</button></div></div>
<div class="box"><h3>User B</h3><select id="langB"><option value="es" selected>Spanish</option><option value="en">English</option><option value="fr">French</option><option value="ur">Urdu</option></select><div class="chat" id="chatB"></div><div class="input-area"><input id="inputB" placeholder="Type..."><button onclick="sendB()">Send</button></div></div>
</div><script>
async function trans(t,f,to){if(f===to)return t;try{const r=await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(t)}&langpair=${f}|${to}`);const d=await r.json();return d.responseData.translatedText||t}catch(e){return t}}
function add(c,txt,me){const ch=document.getElementById(c);const d=document.createElement('div');d.className='msg '+(me?'me':'other');d.innerText=txt;ch.appendChild(d);ch.scrollTop=ch.scrollHeight}
async function sendA(){const i=document.getElementById('inputA');const t=i.value.trim();if(!t)return;const f=document.getElementById('langA').value;const to=document.getElementById('langB').value;add('chatA',t,true);const tr=await trans(t,f,to);add('chatB',tr,false);i.value=''}
async function sendB(){const i=document.getElementById('inputB');const t=i.value.trim();if(!t)return;const f=document.getElementById('langB').value;const to=document.getElementById('langA').value;add('chatB',t,true);const tr=await trans(t,f,to);add('chatA',tr,false);i.value=''}
</script></body></html>
